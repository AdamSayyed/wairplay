<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap");

    :root {
      --bg-deep: #0a0a1a;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-bg-hover: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00d4ff;
      --accent-blue: #4a7dff;
      --accent-purple: #a855f7;
      --accent-gradient: linear-gradient(135deg, #00d4ff, #4a7dff, #a855f7);
      --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.3);
      --text-primary: #f0f0f5;
      --text-secondary: rgba(240, 240, 245, 0.6);
      --text-muted: rgba(240, 240, 245, 0.35);
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      width: 380px;
      min-height: 420px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
      z-index: 0;
    }

    .popup {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .header .logo { font-size: 1.5rem; }

    .header h1 {
      font-family: "Outfit", sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .status-badge--waiting {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.2);
      color: var(--warning);
    }

    .status-badge--connected {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      color: var(--success);
    }

    .status-badge--transferring {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.2);
      color: var(--accent-cyan);
    }

    .status-badge--complete {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: var(--success);
    }

    .status-badge--error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.2);
      color: var(--error);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      position: relative;
      margin-bottom: 16px;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    .qr-area {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      position: relative;
    }

    .qr-area img {
      border-radius: var(--radius-md);
      border: 2px solid var(--glass-border);
      transition: all 0.3s ease;
    }

    .qr-area img:hover {
      border-color: var(--accent-cyan);
      box-shadow: var(--glow-cyan);
    }

    .qr-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--glass-border);
      border-top-color: var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .pulse-wrapper {
      position: relative;
      display: inline-block;
    }

    .pulse-wrapper::before,
    .pulse-wrapper::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 100%; height: 100%;
      border-radius: 12px;
      border: 1.5px solid var(--accent-cyan);
      transform: translate(-50%, -50%);
      animation: pulseBox 2.5s ease-out infinite;
      opacity: 0;
    }

    .pulse-wrapper::after { animation-delay: 1.25s; }

    @keyframes pulseBox {
      0% { width: 100%; height: 100%; opacity: 0.5; }
      100% { width: 140%; height: 140%; opacity: 0; }
    }

    .instruction {
      text-align: center;
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .pairing-url {
      font-family: monospace;
      font-size: 0.68rem;
      color: var(--text-muted);
      word-break: break-all;
      padding: 8px 10px;
      background: rgba(255,255,255,0.03);
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      margin-top: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pairing-url:hover {
      background: rgba(255,255,255,0.06);
      border-color: var(--accent-cyan);
    }

    /* --- Transfer UI --- */
    .transfer-card {
      text-align: center;
    }

    .file-info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      margin-bottom: 14px;
      text-align: left;
    }

    .file-info-row .fi-icon { font-size: 1.8rem; flex-shrink: 0; }

    .file-info-row .fi-details { flex: 1; min-width: 0; }

    .file-info-row .fi-name {
      font-weight: 600; font-size: 0.88rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .file-info-row .fi-size {
      color: var(--text-secondary); font-size: 0.75rem; margin-top: 2px;
    }

    .progress-bar-wrap {
      width: 100%; height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-gradient);
      border-radius: 100px;
      transition: width 0.3s ease-out;
      width: 0%;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* --- History --- */
    .history-section { margin-top: 4px; }

    .history-title {
      font-family: "Outfit", sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .history-list { list-style: none; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      animation: slideIn 0.3s ease-out;
    }

    .history-item:last-child { border-bottom: none; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .history-item .hi-check { color: var(--success); font-size: 1rem; }
    .history-item .hi-name {
      flex: 1; font-size: 0.82rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history-item .hi-size {
      color: var(--text-muted); font-size: 0.72rem; flex-shrink: 0;
    }

    .empty-history {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 16px 0;
    }

    .hidden { display: none !important; }

    .footer {
      text-align: center;
      padding-top: 8px;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="popup">

    <!-- Header -->
    <div class="header">
      <span class="logo">✈</span>
      <h1>WairPlay</h1>
    </div>

    <!-- Status -->
    <div id="statusBadge" class="status-badge status-badge--waiting">
      <span class="status-dot"></span>
      <span id="statusText">Starting session...</span>
    </div>

    <!-- Server Offline -->
    <div id="offlineCard" class="glass-card hidden" style="text-align:center;">
      <p style="font-size:0.9rem; margin-bottom:8px;">⚠️ Server not running</p>
      <p style="font-size:0.78rem; color:var(--text-secondary);">Start the server first:</p>
      <div class="pairing-url" style="margin-top:8px; cursor:default; font-size:0.75rem;">
        npm start
      </div>
    </div>

    <!-- QR Card -->
    <div id="qrCard" class="glass-card">
      <div class="qr-area" id="qrArea">
        <div class="qr-spinner"></div>
      </div>
      <p class="instruction" id="qrInstruction">Generating QR code...</p>
      <div class="pairing-url hidden" id="pairingUrl" title="Click to copy"></div>
    </div>

    <!-- Transfer Card -->
    <div id="transferCard" class="glass-card transfer-card hidden">
      <div class="file-info-row">
        <div class="fi-icon" id="txFileIcon">📄</div>
        <div class="fi-details">
          <div class="fi-name" id="txFileName">—</div>
          <div class="fi-size" id="txFileSize">—</div>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="txProgress"></div>
      </div>
      <div class="progress-stats">
        <span id="txPercent">0%</span>
        <span id="txSpeed">—</span>
      </div>
    </div>

    <!-- History -->
    <div class="history-section" id="historySection">
      <div class="history-title">Received Files</div>
      <ul class="history-list" id="historyList">
        <li class="empty-history" id="emptyHistory">No files received yet</li>
      </ul>
    </div>

    <div class="footer">Scan QR with iPhone camera • Same Wi-Fi required</div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
