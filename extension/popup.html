<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap");

    :root {
      --bg-deep: #0a0a1a;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-bg-hover: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00d4ff;
      --accent-blue: #4a7dff;
      --accent-purple: #a855f7;
      --accent-gradient: linear-gradient(135deg, #00d4ff, #4a7dff, #a855f7);
      --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.3);
      --text-primary: #f0f0f5;
      --text-secondary: rgba(240, 240, 245, 0.6);
      --text-muted: rgba(240, 240, 245, 0.35);
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      width: 380px;
      min-height: 460px;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
      z-index: 0;
    }

    .popup {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    /* --- Header --- */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .header .logo { font-size: 1.5rem; }

    .header h1 {
      font-family: "Outfit", sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* --- Status Badge --- */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 14px;
      transition: all 0.3s ease;
    }

    .status-badge--waiting {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.2);
      color: var(--warning);
    }

    .status-badge--connected {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.2);
      color: var(--success);
    }

    .status-badge--transferring {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.2);
      color: var(--accent-cyan);
    }

    .status-badge--complete {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: var(--success);
    }

    .status-badge--error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.2);
      color: var(--error);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    /* --- Glass Card --- */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      position: relative;
      margin-bottom: 14px;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    /* --- Device Name Row --- */
    .my-device-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .my-device-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }

    .my-device-name {
      font-size: 0.85rem;
      font-weight: 500;
      flex: 1;
      min-width: 0;
    }

    .my-device-name-input {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--accent-cyan);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 4px 8px;
      outline: none;
      width: 100%;
    }

    .rename-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px;
      transition: color 0.2s;
      flex-shrink: 0;
    }

    .rename-btn:hover { color: var(--accent-cyan); }

    /* --- Section Titles --- */
    .section-title {
      font-family: "Outfit", sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    /* --- Device List --- */
    .device-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .device-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }

    .device-card:hover {
      background: var(--glass-bg-hover);
      border-color: rgba(0, 212, 255, 0.3);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.1);
      transform: translateY(-1px);
    }

    .device-card:active {
      transform: scale(0.98);
    }

    .device-emoji {
      font-size: 1.6rem;
      flex-shrink: 0;
      width: 36px;
      text-align: center;
    }

    .device-info {
      flex: 1;
      min-width: 0;
    }

    .device-name {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .device-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .device-arrow {
      color: var(--text-muted);
      font-size: 0.9rem;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    .device-card:hover .device-arrow { color: var(--accent-cyan); }

    /* --- Empty State --- */
    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: var(--text-secondary);
      font-size: 0.82rem;
    }

    .empty-state-icon {
      font-size: 2rem;
      margin-bottom: 8px;
      opacity: 0.6;
    }

    .scanning-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* --- Transfer Card --- */
    .transfer-card {
      text-align: center;
    }

    .transfer-direction {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent-cyan);
      margin-bottom: 10px;
    }

    .file-info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      margin-bottom: 12px;
      text-align: left;
    }

    .file-info-row .fi-icon { font-size: 1.8rem; flex-shrink: 0; }

    .file-info-row .fi-details { flex: 1; min-width: 0; }

    .file-info-row .fi-name {
      font-weight: 600; font-size: 0.86rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .file-info-row .fi-size {
      color: var(--text-secondary); font-size: 0.73rem; margin-top: 2px;
    }

    .progress-bar-wrap {
      width: 100%; height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-gradient);
      border-radius: 100px;
      transition: width 0.3s ease-out;
      width: 0%;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .btn-cancel {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.2);
      color: var(--error);
      padding: 6px 18px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-cancel:hover {
      background: rgba(248, 113, 113, 0.2);
    }

    /* --- History --- */
    .history-section { margin-top: 4px; }

    .history-list { list-style: none; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      animation: slideIn 0.3s ease-out;
    }

    .history-item:last-child { border-bottom: none; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .history-item .hi-icon { font-size: 0.85rem; flex-shrink: 0; }
    .history-item .hi-name {
      flex: 1; font-size: 0.8rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history-item .hi-size {
      color: var(--text-muted); font-size: 0.7rem; flex-shrink: 0;
    }

    .empty-history {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 12px 0;
    }

    .hidden { display: none !important; }

    .footer {
      text-align: center;
      padding-top: 8px;
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* --- Device list enter animation --- */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .device-card { animation: fadeUp 0.3s ease-out both; }
    .device-card:nth-child(2) { animation-delay: 0.05s; }
    .device-card:nth-child(3) { animation-delay: 0.1s; }
    .device-card:nth-child(4) { animation-delay: 0.15s; }

    /* --- Radar scanning dots animation --- */
    .scanning-dots::after {
      content: "";
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }
  </style>
</head>
<body>
  <div class="popup">

    <!-- Header -->
    <div class="header">
      <span class="logo">✈</span>
      <h1>WairPlay</h1>
    </div>

    <!-- Status -->
    <div id="statusBadge" class="status-badge status-badge--waiting">
      <span class="status-dot"></span>
      <span id="statusText">Connecting...</span>
    </div>

    <!-- My Device Name -->
    <div class="my-device-row" id="myDeviceRow">
      <span class="my-device-dot" id="myDeviceDot"></span>
      <span class="my-device-name" id="myDeviceName">Chrome Extension</span>
      <button class="rename-btn" id="renameBtn" title="Rename device">✏️</button>
    </div>

    <!-- Nearby Devices -->
    <div class="glass-card" id="devicesCard">
      <div class="section-title">Nearby Devices</div>
      <div class="device-list" id="deviceList">
        <!-- Device cards injected here -->
      </div>
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon">📡</div>
        <div>Looking for devices<span class="scanning-dots"></span></div>
        <div class="scanning-hint">Open WairPlay on another device on the same Wi-Fi</div>
      </div>
    </div>

    <!-- Transfer Card (hidden by default) -->
    <div id="transferCard" class="glass-card transfer-card hidden">
      <div class="transfer-direction" id="txDirection">Sending...</div>
      <div class="file-info-row">
        <div class="fi-icon" id="txFileIcon">📄</div>
        <div class="fi-details">
          <div class="fi-name" id="txFileName">—</div>
          <div class="fi-size" id="txFileSize">—</div>
        </div>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="txProgress"></div>
      </div>
      <div class="progress-stats">
        <span id="txPercent">0%</span>
        <span id="txStatus">—</span>
      </div>
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
    </div>

    <!-- History -->
    <div class="history-section" id="historySection">
      <div class="section-title">Transfer History</div>
      <ul class="history-list" id="historyList">
        <li class="empty-history" id="emptyHistory">No transfers yet</li>
      </ul>
    </div>

    <div class="footer">P2P transfers — your server never touches files</div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" multiple style="display:none;">

  </div>

  <script src="popup.js"></script>
</body>
</html>
